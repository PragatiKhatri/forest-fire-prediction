<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Fire Weather Index Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F4; --surface:#fff; --ink:#16202A; --ink-soft:#5B6B7A;
    --line:#D7DEE4; --teal:#1F6F6F; --teal-deep:#164F4F; --amber:#E8963C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 24px;}
  h1{font-family:'IBM Plex Mono',monospace;font-size:24px;margin-bottom:4px;}
  p.sub{color:var(--ink-soft);margin-top:0;margin-bottom:28px;font-size:14px;}
  form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;}
  input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  button{margin-top:20px;width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:14px;cursor:pointer;}
  button:hover{background:var(--teal-deep);}
  .result{margin-top:24px;padding:20px;border-radius:10px;background:var(--ink);color:#E9EDF0;font-family:'IBM Plex Mono',monospace;}
  .result .val{font-size:32px;color:var(--amber);font-weight:600;}
  .error{margin-top:16px;color:#B8722A;font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fire Weather Index Predictor</h1>
  <p class="sub">Enter today's readings to estimate the FWI (Fire Weather Index).</p>

  <form method="POST" action="/predict">
    <div class="grid">
      {% for f in features %}
      <div>
        <label for="{{ f }}">{{ f }}</label>
        <input type="number" step="0.1" id="{{ f }}" name="{{ f }}"
               value="{{ values[f] if values else '' }}" required>
      </div>
      {% endfor %}
    </div>
    <button type="submit">Predict FWI</button>
  </form>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  {% if result %}
  <div class="result">
    <div>predicted_fwi =</div>
    <div class="val">{{ result.fwi }}</div>
    <div>risk_level: {{ result.risk }}</div>
  </div>
  {% endif %}
</div>
</body>
</html>
